<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laureate Certificate Systems</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1a2d28; --forest-2:#24403a; --paper:#f7f5f0; --card:#fff; --field:#faf8f4;
  --ink:#141414; --muted:#6b6a63; --line:#d9d5cb; --accent:#c8553d; --ok:#2e7d5b; --disabled:#c8c2b8;
  --serif:'Bodoni Moda','Didot',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{font-family:var(--sans);color:var(--ink)}
body{background:var(--paper);min-height:100vh}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:36px;height:36px;background:var(--forest);display:grid;place-items:center}
.logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6}
.brand-name{font-family:var(--serif);font-size:22px;line-height:1}
.brand-sub{font-size:9px;letter-spacing:.28em;color:var(--muted);margin-top:4px;text-transform:uppercase}
.status{display:flex;align-items:center;gap:32px;font-weight:500;font-size:15px}
.online{color:var(--forest);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.admin{background:none;border:0;display:flex;align-items:center;gap:8px;font-weight:600}

.layout{display:grid;grid-template-columns:346px 1fr;min-height:calc(100vh - 70px)}
aside{background:var(--forest);color:#fff;padding:56px 27px;position:relative;overflow:hidden}
aside::before,aside::after{content:"";position:absolute;border:1px solid rgba(255,255,255,.1);border-radius:50%}
aside::before{width:440px;height:440px;left:70px;top:290px}
aside::after{width:320px;height:320px;left:130px;top:350px}
.batch{font-size:11px;letter-spacing:.3em;color:rgba(255,255,255,.55);text-transform:uppercase}
aside h2{font-family:var(--serif);font-weight:500;font-size:56px;line-height:1.02;margin:42px 0 36px;letter-spacing:-.02em}
aside p{font-size:17px;line-height:1.55;color:rgba(255,255,255,.75);max-width:280px}
.steps{list-style:none;padding:0;margin-top:96px;position:relative;z-index:1;display:grid;gap:24px}
.steps li{display:flex;align-items:center;gap:20px;font-weight:500;color:rgba(255,255,255,.7)}
.steps li.done,.steps li.current{color:#fff}
.num{width:28px;height:28px;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center;font-size:10px;color:rgba(255,255,255,.7)}
.steps li.done .num{background:var(--ok);border-color:var(--ok);color:#fff}

main{padding:56px 48px 80px}
.wrap{max-width:1130px}
.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;font-weight:500}
.title{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-bottom:30px;border-bottom:1px solid var(--line);margin-top:10px}
.title h1{font-family:var(--serif);font-weight:500;font-size:64px;line-height:1;letter-spacing:-.025em}
.title p{color:var(--muted);font-size:15px;line-height:1.55;max-width:300px;padding-bottom:6px}

.panel{background:var(--card);border:1px solid var(--line);padding:36px 32px;margin-top:48px}
.panel+.panel{margin-top:20px}
.panel-head{display:flex;align-items:center;gap:20px;margin-bottom:36px}
.badge{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none}
.panel h3{font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:-.01em}

.drop{border:1px dashed #a9a69c;background:var(--field);display:flex;align-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{background:#f2efe8;border-color:var(--forest)}
.drop.big{flex-direction:column;justify-content:center;text-align:center;padding:72px 24px;gap:6px}
.up{width:44px;height:44px;border-radius:50%;background:#ece9e1;display:grid;place-items:center;margin-bottom:14px}
.up svg,.imgico svg{width:20px;height:20px;stroke:#3a3a36;fill:none;stroke-width:1.6}
.drop strong{font-size:16px;font-weight:700}
.drop small{color:var(--muted);font-size:13.5px}
.drop.row{padding:20px;gap:18px;width:100%;text-align:left}
.imgico{width:48px;height:48px;background:#ece9e1;display:grid;place-items:center;flex:none}
.drop.row .t{flex:1}
.drop.row .arrow{color:var(--muted);font-size:20px}
.drop.ready{border-style:solid;border-color:var(--ok);background:#f3f8f5}
.fileinfo{margin-top:10px;font-size:13px;color:var(--ok);font-weight:600}
.err{margin-top:10px;font-size:13px;color:var(--accent);font-weight:600;min-height:0}

.counters{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.counter{border:1px solid var(--line);padding:22px 28px 26px}
.counter label{display:block;font-size:12px;letter-spacing:.18em;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:22px}
.ctrl{display:flex;align-items:center;justify-content:space-between}
.ctrl button{width:36px;height:36px;background:#fff;border:1px solid var(--line);font-size:20px;line-height:1}
.ctrl button:hover{border-color:var(--forest)}
.ctrl button:disabled{opacity:.35;cursor:not-allowed}
.ctrl output{font-family:var(--serif);font-size:56px;line-height:1}
.required{background:var(--forest);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 40px;height:64px;margin-top:24px}
.required span{color:rgba(255,255,255,.75);font-size:15px}
.required b{font-family:var(--serif);font-weight:500;font-size:44px}

.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.thumbs figure{width:92px}
.thumbs img{width:92px;height:66px;object-fit:cover;border:1px solid var(--line);display:block}
.thumbs figcaption{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.panel .lead{color:var(--muted);font-size:17px;margin-bottom:24px}
.send{width:100%;height:52px;border:0;background:var(--forest);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:12px}
.send:disabled{background:var(--disabled);cursor:not-allowed}
.send svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6}
.msg{margin-top:14px;font-size:14px;font-weight:600}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--accent)}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{padding:36px 24px}aside h2{font-size:44px}.steps,aside::before,aside::after{display:none}
  main{padding:32px 18px 60px}.title h1{font-size:44px}
  .counters{grid-template-columns:1fr}.status .online{display:none}
}
</style>
</head>

<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z
